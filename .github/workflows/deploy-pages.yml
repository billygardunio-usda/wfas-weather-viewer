name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-nomads.txt
      - run: python -m pip install -r requirements-nomads.txt
      - run: python -m unittest tests/test_sync_nomads.py
      - run: python -m unittest tests/test_sync_urma_daily.py
      - uses: actions/cache@v4
        with:
          path: public/nomads
          key: nomads-gfs-${{ github.run_id }}
          restore-keys: nomads-gfs-
      - name: Refresh NOMADS grids
        continue-on-error: true
        run: python scripts/sync_nomads.py
      - run: npm ci
      - run: npm test
      - run: npm run sync-catalog
      - uses: actions/cache@v4
        with:
          path: public/urma-daily
          key: urma-daily-v2-${{ github.run_id }}
          restore-keys: urma-daily-v2-
      - name: Refresh URMA daily summaries
        continue-on-error: true
        run: python scripts/sync_urma_daily.py
      - run: npm exec vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4